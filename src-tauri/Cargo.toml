[package]
name = "toolbox"
version = "1.0.0"
description = "工具箱：綜合多功能桌面工具"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
arboard = "3"
rodio = "0.20"
rfd = "0.15"
ureq = { version = "2", features = ["json"] }
memmap2 = "0.9"
flate2 = "1"
png = "0.17"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-single-instance = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
# 跟 webview2-com 用同一版的字串型別（CallDevToolsProtocolMethod 的參數）
windows-core = "0.62"
windows = { version = "0.58", features = ["Foundation", "Foundation_Collections", "Data_Xml_Dom", "UI_Notifications", "Media_SpeechSynthesis", "Storage_Streams"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_System_Registry",
  "Win32_Security",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_UI_HiDpi",
  "Win32_UI_Accessibility",
  "Win32_System_SystemInformation",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
