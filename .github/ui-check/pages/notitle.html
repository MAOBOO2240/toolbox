<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; font: 18px sans-serif; background: #fff; }
  #q { position: fixed; left: 20px; top: 20px; width: 360px; height: 40px; font-size: 22px; }
  #st { position: fixed; left: 20px; top: 90px; }
</style></head>
<body>
<input id="q" placeholder="type here">
<div id="st">loading</div>
<script>
  // 一開始沒有 <title>，載入時一直往 <head> 加東西，全部加完才設定標題（X 的舊版網頁就是這樣）。
  // 程式注入的「有沒有在打字」小腳本以前在這種網頁上會讓整個網頁卡死
  const log = (m) => fetch('/log?m=' + encodeURIComponent('[notitle] ' + m)).catch(() => {});
  q.addEventListener('input', () => log('input:' + q.value));
  const N = 40, t0 = performance.now();
  let i = 0, last = t0, max = 0;
  log('start');
  const next = () => {
    const now = performance.now(), dt = now - last;
    last = now;
    if (i > 0) { if (dt > max) max = dt; if (dt > 300) log('slow step ' + i + ' ' + Math.round(dt) + 'ms'); }
    if (i < N) {
      const m = document.createElement('meta');
      m.name = 'x' + i;
      document.head.appendChild(m);
      i++;
      st.textContent = 'step ' + i;
      setTimeout(next, 20);
      return;
    }
    document.title = '晚到的標題';
    st.textContent = 'done';
    log('done steps=' + i + ' total=' + Math.round(now - t0) + 'ms max=' + Math.round(max) + 'ms');
  };
  addEventListener('DOMContentLoaded', () => setTimeout(next, 20));
</script>
</body></html>
