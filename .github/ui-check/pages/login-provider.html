<!doctype html>
<html><head><meta charset="utf-8"><title>別的網站</title></head>
<body>provider
<script>
  const log = (m) => fetch('/log?m=' + encodeURIComponent('[provider] ' + m)).catch(() => {});
  let op = 'none';
  try { op = window.opener ? 'true' : 'false'; } catch (e) { op = 'error'; }
  log('loaded origin=' + location.origin + ' opener=' + op);
  setTimeout(() => { location.href = new URLSearchParams(location.search).get('back'); }, 700);
</script>
</body></html>
