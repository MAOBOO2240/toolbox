<!doctype html>
<html><head><meta charset="utf-8"><title>提示文字測試</title>
<style>
  :root { --tool: #3c3c3c; --pill: #282828; --text: #e3e3e3; --text2: #c7c7c7; --hover: rgba(227,227,227,0.1); }
  html, body { margin: 0; background: var(--tool); color: var(--text); font: 12px/1.3 "Segoe UI", sans-serif; user-select: none; }
  svg.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; display: block; }
  button { padding: 0; font: inherit; border: 0; background: none; color: inherit; cursor: default; }
  .gl { display: grid; place-items: center; }
  .tb { flex: none; width: 34px; height: 34px; margin: 0 1px; border-radius: 50%; color: var(--text2); display: grid; place-items: center; position: relative; }
  .tb:hover { background: var(--hover); }
  .chip { flex: none; height: 24px; min-width: 24px; border-radius: 12px; background: #555; color: var(--text2); display: flex; align-items: center; gap: 6px; padding: 0 2px; }
  .chip:hover { background: #777; }
  .chip .gl { width: 20px; height: 20px; }
  .chip .gl svg { width: 16px; height: 16px; stroke-width: 2; }
  .row { display: flex; gap: 56px; padding: 26px 40px; align-items: center; }
  .plain { width: 24px; height: 24px; background: #555; }
  /* 修法：裡面的圖示不單獨接滑鼠 */
  .fix > svg, .fix > span { pointer-events: none; }
</style></head>
<body>
<!-- A：每個的提示文字都不一樣。只看「滑鼠底下的元素會不會換」這件事 -->
<div class="row">
  <button class="chip" id="a1" title="A1 線條上"></button>
  <button class="chip fix" id="a2" title="A2 線條上（修過）"></button>
  <button class="chip" id="a3" title="A3 沒有線條"></button>
  <button class="plain" id="a4" title="A4 文字">i</button>
  <button class="tb" id="a5" title="A5 大按鈕線條上"></button>
  <button class="tb fix" id="a6" title="A6 大按鈕線條上（修過）"></button>
</div>
<!-- B：同一段提示文字。前一個失敗之後，同一段文字還會不會出現 -->
<div class="row">
  <button class="chip" id="b1" title="同一段文字"></button>
  <button class="chip" id="b2" title="同一段文字"></button>
  <button class="chip" id="b3" title="B3 不一樣的文字"></button>
  <button class="chip" id="b4" title="同一段文字"></button>
  <button class="chip fix" id="b5" title="同一段文字"></button>
</div>
<!-- C：按「開始」之後每 250ms 把圖示換掉（舊版工具列每次狀態更新都這樣做） -->
<div class="row">
  <button class="plain" id="go" style="width:60px">開始</button>
  <button class="chip fix" id="c1" title="C1 一直換圖示（修過）"></button>
  <button class="chip" id="c2" title="C2 一直換圖示"></button>
</div>
<script>
  const log = (m) => fetch('/log?m=' + encodeURIComponent('[tip] ' + m)).catch(() => {});
  const svg = (inner) => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${inner}</svg>`;
  const INFO = svg('<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.2M12 7.6v.4"/>');
  const TUNE = svg('<circle cx="8.8" cy="8" r="2.4"/><circle cx="15.2" cy="16" r="2.4"/><path d="M12 8h8M4 8h2.2M4 16h8M17.8 16H20"/>');
  const $ = (i) => document.getElementById(i);
  const gl = (html) => { const s = document.createElement('span'); s.className = 'gl'; s.innerHTML = html; return s; };
  for (const i of ['a1', 'a2', 'b1', 'b5', 'c1', 'c2']) $(i).append(gl(INFO));
  for (const i of ['a3', 'b2', 'b3', 'b4']) $(i).append(gl(TUNE));
  $('a5').innerHTML = INFO;
  $('a6').innerHTML = INFO;
  $('go').onclick = () => { log('churn start'); setInterval(() => { for (const i of ['c1', 'c2']) { $(i).innerHTML = ''; $(i).append(gl(INFO)); } }, 250); };
  document.addEventListener('mouseover', (e) => { const b = e.target.closest && e.target.closest('button'); if (b) log('over ' + b.id + ' ' + e.target.tagName); });
  log('load');
</script>
</body></html>
