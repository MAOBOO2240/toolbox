name: UI check

# Only runs on the ui-check branch. Starts the test build (the one the dev branch produced) on a real
# Windows desktop, drives the browser window with mouse and keyboard, and saves screenshots and a log
# to a results branch. Nothing is released from here.
on:
  push:
    branches: [ui-check]

permissions:
  contents: write

concurrency:
  group: ui-check
  cancel-in-progress: true

jobs:
  ui:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: pip install pillow websocket-client uiautomation

      - name: Download test build
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download test -R $env:GITHUB_REPOSITORY -p MAOBOO.zip -D dl
          Expand-Archive dl/MAOBOO.zip -DestinationPath app
          Get-ChildItem app | Select-Object Name, Length
          gh release view test -R $env:GITHUB_REPOSITORY --json name,targetCommitish,publishedAt

      - name: Run UI check
        shell: pwsh
        timeout-minutes: 32
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python .github/ui-check/$((Get-Content .github/ui-check/entry.txt -ErrorAction SilentlyContinue | Select-Object -First 1) ?? 'run.py') app/MAOBOO.exe

      # Results (screenshots, log) go to the uitest-results-ui-check branch, replacing the previous run
      - name: Publish results
        if: always()
        shell: bash
        run: |
          mkdir -p uitest-out
          cd uitest-out
          git init -q
          git config user.name "ui-check"
          git config user.email "ui-check@users.noreply.github.com"
          git checkout -q -b results
          git add -A
          git commit -q -m "ui-check ${GITHUB_SHA::7}" || true
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "results:uitest-results-ui-check"
