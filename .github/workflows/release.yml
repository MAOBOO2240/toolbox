name: Build & Release

# 推送到 main 或手動觸發時，在 Windows 上編譯並覆蓋發布 v1.0.0
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install

      - name: Run tests
        working-directory: src-tauri
        shell: bash
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
        run: |
          set -o pipefail
          if ! cargo test 2>&1 | tee ../test.log; then
            bash ../.github/report.sh "cargo test" "$PWD/../test.log"
            exit 1
          fi

      - name: Build exe
        shell: bash
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
        run: |
          set -o pipefail
          # 只回報有沒有設定，不會顯示權杖、金鑰內容
          if [ -n "$UPDATE_TOKEN" ]; then echo "::notice title=更新權限::已內建"; else echo "::notice title=更新權限::未設定 UPDATE_TOKEN"; fi
          if [ -n "$NEXON_API_KEY" ]; then echo "::notice title=Nexon 金鑰::使用 NEXON_API_KEY 祕密"; else echo "::notice title=Nexon 金鑰::使用程式碼裡原本的金鑰"; fi
          if ! npm run build 2>&1 | tee build.log; then
            bash .github/report.sh "build" "$PWD/build.log"
            exit 1
          fi

      - name: Prepare asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src-tauri/target/release/toolbox.exe dist/MAOBOO.exe
          # 使用規範一起放進壓縮檔
          Copy-Item "docs/使用規範.txt" "dist/使用規範.txt"
          # 新版本的雜湊值：自動更新時用來確認下載的檔案和這裡編譯出來的一模一樣
          $hash = (Get-FileHash dist/MAOBOO.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist/MAOBOO.sha256 -Value "$hash  MAOBOO.exe" -NoNewline -Encoding ascii
          Compress-Archive -Path dist/MAOBOO.exe, "dist/使用規範.txt" -DestinationPath dist/MAOBOO.zip -CompressionLevel Optimal -Force
          Get-ChildItem dist | Select-Object Name, Length
          Get-Content dist/MAOBOO.sha256

      - name: Replace v1.0.0 release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --cleanup-tag --yes || true
          git push origin :refs/tags/v1.0.0 || true
          gh release create v1.0.0 dist/MAOBOO.zip dist/MAOBOO.sha256 \
            --target "$GITHUB_SHA" \
            --title "工具箱 v1.0.0" \
            --notes "Windows 10/11 免安裝版，下載 MAOBOO.zip 解壓縮後執行 MAOBOO.exe。

          最後更新：$(date -u '+%Y-%m-%d %H:%M UTC')（commit ${GITHUB_SHA::7}）

          使用前請先看壓縮檔裡的「使用規範.txt」。

          首次執行若出現 SmartScreen「Windows 已保護您的電腦」，請點「其他資訊」→「仍要執行」。"
