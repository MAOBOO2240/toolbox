name: Build & Release

# 推送到 main 或手動觸發時，在 Windows 上編譯並發布 v<版本號>（版本號在 src-tauri/tauri.conf.json，每次更新 +0.0.1）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install

      - name: Run tests
        working-directory: src-tauri
        shell: bash
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
        run: |
          set -o pipefail
          if ! cargo test 2>&1 | tee ../test.log; then
            bash ../.github/report.sh "cargo test" "$PWD/../test.log"
            exit 1
          fi

      - name: Build exe
        shell: bash
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
        run: |
          set -o pipefail
          # 只回報有沒有設定，不會顯示金鑰內容。沒有設定的話，程式查不到楓之谷資料
          if [ -n "$NEXON_API_KEY" ]; then echo "::notice title=Nexon 金鑰::使用 NEXON_API_KEY 祕密"; else echo "::error title=Nexon 金鑰::沒有設定 NEXON_API_KEY，這個版本查不到楓之谷資料"; fi
          if ! npm run build 2>&1 | tee build.log; then
            bash .github/report.sh "build" "$PWD/build.log"
            exit 1
          fi

      - name: Prepare asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src-tauri/target/release/toolbox.exe dist/MAOBOO.exe
          # 使用規範一起放進壓縮檔
          Copy-Item "docs/使用規範.txt" "dist/使用規範.txt"
          # 新版本的雜湊值：自動更新時用來確認下載的檔案和這裡編譯出來的一模一樣
          $hash = (Get-FileHash dist/MAOBOO.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist/MAOBOO.sha256 -Value "$hash  MAOBOO.exe" -NoNewline -Encoding ascii
          Compress-Archive -Path dist/MAOBOO.exe, "dist/使用規範.txt" -DestinationPath dist/MAOBOO.zip -CompressionLevel Optimal -Force
          Get-ChildItem dist | Select-Object Name, Length
          Get-Content dist/MAOBOO.sha256

      - name: Publish release v<version>
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v$VER"
          echo "::notice title=版本::$TAG"
          # 同一個版本號重新建置時覆蓋掉原本的
          gh release delete "$TAG" --cleanup-tag --yes || true
          git push origin ":refs/tags/$TAG" || true
          gh release create "$TAG" dist/MAOBOO.zip dist/MAOBOO.sha256 \
            --latest \
            --target "$GITHUB_SHA" \
            --title "工具箱 $TAG" \
            --notes "Windows 10/11 免安裝版，下載 MAOBOO.zip 解壓縮後執行 MAOBOO.exe。

          最後更新：$(date -u '+%Y-%m-%d %H:%M UTC')（commit ${GITHUB_SHA::7}）

          使用前請先看壓縮檔裡的「使用規範.txt」。

          首次執行若出現 SmartScreen「Windows 已保護您的電腦」，請點「其他資訊」→「仍要執行」。"
