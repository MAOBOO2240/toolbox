<!doctype html>
<html><head><meta charset="utf-8"><title>frame</title></head>
<body style="margin:0;background:#ffe">
<input id="f" style="margin:10px;width:300px;height:36px;font-size:20px" placeholder="frame input">
<script>
  const log = (m) => fetch('http://localhost:8765/log?m=' + encodeURIComponent('[frame] ' + m)).catch(() => {});
  f.addEventListener('input', () => log('input:' + f.value));
  // 診斷：點擊、選取有沒有到內嵌框
  document.addEventListener('pointerdown', (e) => log('pointerdown ' + (e.target.id || e.target.tagName) + ' hasFocus=' + document.hasFocus() + ' mb=' + !!window.__mbTyping), true);
  f.addEventListener('focus', () => log('focus hasFocus=' + document.hasFocus()));
  f.addEventListener('blur', () => log('blur'));
  addEventListener('blur', () => log('window blur'));
  log('load mb=' + !!window.__mbTyping);
</script>
</body></html>
