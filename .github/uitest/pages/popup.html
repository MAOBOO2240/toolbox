<!doctype html>
<html><head><meta charset="utf-8"><title>登入小視窗</title></head>
<body style="font:18px sans-serif">
<input id="u" style="width:300px;height:36px;font-size:20px" placeholder="popup input" autofocus>
<script>
  const log = (m) => fetch('/log?m=' + encodeURIComponent('[popup] ' + m)).catch(() => {});
  u.addEventListener('input', () => log('input:' + u.value));
  log('opened opener=' + !!window.opener);
</script>
</body></html>
