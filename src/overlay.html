<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>計時器浮動視窗</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      font-family: "Segoe UI Variable Display", "Segoe UI", "Microsoft JhengHei UI", sans-serif;
    }
    .ov {
      --bg: 0.35;
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4px 32px 4px 10px; /* 右邊留給圖釘 */
      box-sizing: border-box;
      border-radius: 14px;
      container-type: size;
      /* 只有底色有透明度，文字永遠不透明 */
      background: rgba(18, 18, 20, var(--bg));
    }
    /* 未鎖定：可拖曳，右下角顯示縮放把手（不顯示邊框） */
    .ov.unlocked { cursor: move; }
    /* 每一列的高度依計時器數量平均分配，但不會過高 */
    .row {
      flex: none;
      height: calc(100cqh / var(--n, 1));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: min(18cqh, 14px);
      container-type: size;
    }
    /* 文字不截斷，太長時由視窗自動加寬 */
    .name {
      flex: none;
      /* 依高度縮放，但有上限，視窗拉很大時字也不會太大 */
      font-size: min(36cqh, 20px);
      font-weight: 500;
      color: #fff;
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9), 0 0 6px rgba(0, 0, 0, 0.6);
    }
    .time {
      --heat: 0;
      flex: none;
      font-size: min(68cqh, 38px);
      font-weight: 500;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      /* 倒數中：粗體白色填滿＋陰影，越接近結束越紅 */
      color: color-mix(in srgb, #ff3b30 calc(var(--heat) * 100%), #ffffff);
      text-shadow: 0 2px 3px rgba(0, 0, 0, 0.9), 0 0 8px rgba(0, 0, 0, 0.55);
    }
    /* 超時：紅色外框、不填滿 */
    .time.over {
      color: transparent;
      -webkit-text-stroke: max(1.2px, 0.035em) #ff3b30;
      text-shadow: none;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.8));
    }
    .time.idle, .time.done { color: rgba(255, 255, 255, 0.72); }
    .grip {
      display: none;
      position: absolute;
      right: 2px;
      bottom: 2px;
      width: 16px;
      height: 16px;
      cursor: se-resize;
      background: linear-gradient(135deg, transparent 50%, rgba(255,255,255,.85) 50%, rgba(255,255,255,.85) 60%, transparent 60%, transparent 72%, rgba(255,255,255,.85) 72%, rgba(255,255,255,.85) 82%, transparent 82%);
    }
    .ov.unlocked .grip { display: block; }
    /* 右上角圖釘：鎖定／解除鎖定 */
    .pin {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 7px;
      padding: 0;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      opacity: 0.45;
      transition: opacity 0.15s, background 0.15s;
    }
    .pin:hover { opacity: 1; background: rgba(255, 255, 255, 0.28); }
    .pin svg { width: 15px; height: 15px; fill: currentColor; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.8)); }
    /* 解除鎖定時：圖釘拔起來（傾斜、藍色） */
    .ov.unlocked .pin { opacity: 1; background: #4c8dff; }
    .ov.unlocked .pin svg { transform: rotate(40deg); }
  </style>
</head>
<body>
  <div class="ov" id="ov">
    <button class="pin" id="pin" title="鎖定／解除鎖定（解除後可拖曳移動、拉右下角調整大小）">
      <svg viewBox="0 0 24 24"><path d="M15.5 2.5 21.5 8.5 19.4 9.3 15.9 12.8 16.5 17.6 14.8 19.3 10.6 15.1 4.6 21.1 2.9 21.1 2.9 19.4 8.9 13.4 4.7 9.2 6.4 7.5 11.2 8.1 14.7 4.6Z"/></svg>
    </button>
    <div class="grip" id="grip"></div>
  </div>
  <script>
    "use strict";
    const T = window.__TAURI__;
    const win = T.window.getCurrentWindow();
    const ov = document.getElementById("ov");
    const grip = document.getElementById("grip");
    const pin = document.getElementById("pin");
    const rows = new Map();

    const pad = (n) => String(n).padStart(2, "0");
    function fmt(sec) {
      sec = Math.max(0, sec);
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
      return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
    }

    function rowFor(id) {
      let r = rows.get(id);
      if (!r) {
        const el = document.createElement("div");
        el.className = "row";
        el.innerHTML = '<span class="name"></span><span class="time"></span>';
        r = { el, name: el.firstChild, time: el.lastChild };
        rows.set(id, r);
      }
      return r;
    }

    let locked = true;
    T.event.listen("timer-tick", (e) => {
      const p = e.payload;
      ov.style.setProperty("--bg", p.overlay.bg);
      locked = p.overlay.locked;
      ov.classList.toggle("unlocked", !locked);

      // 只顯示正在倒數或超時的計時器，依原本順序排列
      const list = p.timers.filter((s) => s.active && (s.phase === "running" || s.phase === "over"));
      ov.style.setProperty("--n", Math.max(1, list.length));
      const keep = new Set(list.map((s) => s.id));
      for (const [id, r] of rows) if (!keep.has(id)) { r.el.remove(); rows.delete(id); }
      list.forEach((s, i) => {
        const r = rowFor(s.id);
        if (ov.children[i] !== r.el) ov.insertBefore(r.el, ov.children[i] || pin);
        if (r.name.textContent !== s.name) r.name.textContent = s.name;
        let text;
        if (s.phase === "over") text = "+" + fmt(Math.floor(s.over_ms / 1000));
        else if (s.phase === "running") text = fmt(Math.ceil(s.remain_ms / 1000));
        else if (s.phase === "done") text = "00:00";
        else text = fmt(Math.round(s.total_ms / 1000));
        if (r.time.textContent !== text) r.time.textContent = text;
        r.time.className = "time " + s.phase;
        let heat = 0;
        if (s.phase === "running" && s.total_ms) {
          const frac = s.remain_ms / s.total_ms;
          heat = frac >= 0.3 ? 0 : Math.min(1, 1 - frac / 0.3);
        }
        r.time.style.setProperty("--heat", heat.toFixed(3));
      });
      fitWidth();
    });

    // 文字放不下時加寬視窗，並把最小寬度設成剛好放得下的大小
    const LogicalSize = (T.window && T.window.LogicalSize) || (T.dpi && T.dpi.LogicalSize);
    let minW = 0;
    function fitWidth() {
      if (!LogicalSize || rows.size === 0) return;
      // 只量文字本身的寬度（scrollWidth 不會小於目前寬度，用它會讓視窗越變越寬）
      let need = 0;
      for (const r of rows.values()) {
        const gap = parseFloat(getComputedStyle(r.el).columnGap) || 0;
        need = Math.max(need, r.name.offsetWidth + gap + r.time.offsetWidth);
      }
      need = Math.ceil(need + 46); // 左右內距 + 圖釘
      if (Math.abs(need - minW) > 2) {
        minW = need;
        win.setMinSize(new LogicalSize(minW, 50)).catch(() => {});
      }
      if (window.innerWidth + 1 < need) {
        win.setSize(new LogicalSize(need, window.innerHeight)).catch(() => {});
      }
    }

    // 未鎖定時：拖曳移動、右下角縮放
    pin.addEventListener("mousedown", (e) => e.stopPropagation());
    pin.addEventListener("click", async () => {
      locked = !locked;
      ov.classList.toggle("unlocked", !locked);
      try { await T.core.invoke("overlay_toggle_lock"); } catch (_) {}
    });
    ov.addEventListener("mousedown", (e) => {
      if (locked || e.button !== 0 || e.target.closest(".pin")) return;
      if (e.target === grip) win.startResizeDragging("SouthEast");
      else win.startDragging();
    });
    document.addEventListener("contextmenu", (e) => e.preventDefault());
  </script>
</body>
</html>
