<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>計時器浮動視窗</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      font-family: "Segoe UI Variable Display", "Segoe UI", "Microsoft JhengHei UI", sans-serif;
    }
    .ov {
      --bg: 0.35;
      /* 文字大小由程式依視窗大小計算（放大縮小都跟著視窗） */
      --fs: 34px;
      font-size: var(--fs);
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 6px 16px;
      box-sizing: border-box;
      border-radius: 22px;
      /* 細邊框，跟底色一起透明 */
      border: 1.5px solid rgba(255, 255, 255, calc(var(--bg) * 0.45));
      /* 只有底色有透明度，文字永遠不透明 */
      background: rgba(18, 18, 20, var(--bg));
    }
    /* 未鎖定：可拖曳，右下角顯示縮放把手（不顯示邊框） */
    .ov.unlocked { cursor: move; }
    /* 文字跟著視窗大小縮放，永遠完整顯示（不會變成「…」） */
    .row {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4em;
      padding: 0.05em 0;
      line-height: 1.15;
    }
    .name {
      flex: none;
      font-size: 1em;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9), 0 0 6px rgba(0, 0, 0, 0.6);
    }
    .time {
      --heat: 0;
      flex: none;
      font-size: 1em;
      font-weight: 600;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      /* 倒數中：粗體白色填滿＋陰影，越接近結束越紅 */
      color: color-mix(in srgb, #ff3b30 calc(var(--heat) * 100%), #ffffff);
      text-shadow: 0 2px 3px rgba(0, 0, 0, 0.9), 0 0 8px rgba(0, 0, 0, 0.55);
    }
    /* 超時：紅色外框、不填滿 */
    .time.over {
      color: transparent;
      -webkit-text-stroke: max(1.2px, 0.035em) #ff3b30;
      text-shadow: none;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.8));
    }
    .time.idle, .time.done { color: rgba(255, 255, 255, 0.72); }
    .grip {
      display: none;
      position: absolute;
      right: 2px;
      bottom: 2px;
      width: 16px;
      height: 16px;
      cursor: se-resize;
      background: linear-gradient(135deg, transparent 50%, rgba(255,255,255,.85) 50%, rgba(255,255,255,.85) 60%, transparent 60%, transparent 72%, rgba(255,255,255,.85) 72%, rgba(255,255,255,.85) 82%, transparent 82%);
    }
    .ov.unlocked .grip { display: block; }
  </style>
</head>
<body>
  <div class="ov" id="ov"><div class="grip" id="grip"></div></div>
  <script>
    "use strict";
    const T = window.__TAURI__;
    const win = T.window.getCurrentWindow();
    const ov = document.getElementById("ov");
    const grip = document.getElementById("grip");
    const rows = new Map();

    const pad = (n) => String(n).padStart(2, "0");
    function fmt(sec) {
      sec = Math.max(0, sec);
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
      return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
    }

    function rowFor(id) {
      let r = rows.get(id);
      if (!r) {
        const el = document.createElement("div");
        el.className = "row";
        el.innerHTML = '<span class="name"></span><span class="time"></span>';
        r = { el, name: el.firstChild, time: el.lastChild };
        rows.set(id, r);
      }
      return r;
    }

    let locked = true;
    T.event.listen("timer-tick", (e) => {
      const p = e.payload;
      ov.style.setProperty("--bg", p.overlay.bg);
      locked = p.overlay.locked;
      ov.classList.toggle("unlocked", !locked);

      // 只顯示正在倒數或超時的計時器，依原本順序排列
      const list = p.timers.filter((s) => s.active && (s.phase === "running" || s.phase === "over"));
      ov.style.setProperty("--n", Math.max(1, list.length));
      const keep = new Set(list.map((s) => s.id));
      for (const [id, r] of rows) if (!keep.has(id)) { r.el.remove(); rows.delete(id); }
      list.forEach((s, i) => {
        const r = rowFor(s.id);
        if (ov.children[i] !== r.el) ov.insertBefore(r.el, ov.children[i] || grip);
        if (r.name.textContent !== s.name) r.name.textContent = s.name;
        let text;
        if (s.phase === "over") text = "+" + fmt(Math.floor(s.over_ms / 1000));
        else if (s.phase === "running") text = fmt(Math.ceil(s.remain_ms / 1000));
        else if (s.phase === "done") text = "00:00";
        else text = fmt(Math.round(s.total_ms / 1000));
        if (r.time.textContent !== text) r.time.textContent = text;
        r.time.className = "time " + s.phase;
        let heat = 0;
        if (s.phase === "running" && s.total_ms) {
          const frac = s.remain_ms / s.total_ms;
          heat = frac >= 0.3 ? 0 : Math.min(1, 1 - frac / 0.3);
        }
        r.time.style.setProperty("--heat", heat.toFixed(3));
      });
      fitText();
    });

    // 文字大小跟著視窗：算出剛好塞滿視窗（寬、高都放得下）的字級，視窗變大字就變大，變小字就變小
    let fs = 34;
    function fitText() {
      const items = [...rows.values()].map((r) => r.el);
      if (!items.length) return;
      const cs = getComputedStyle(ov);
      const W = ov.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 2;
      const H = ov.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 2;
      if (W <= 0 || H <= 0) return;
      // 兩次就會收斂（字寬與字級成正比）
      for (let pass = 0; pass < 2; pass++) {
        let needW = 0, needH = 0;
        for (const el of items) {
          const gap = parseFloat(getComputedStyle(el).columnGap) || 0;
          needW = Math.max(needW, el.firstChild.offsetWidth + gap + el.lastChild.offsetWidth);
          needH += el.offsetHeight;
        }
        if (!needW || !needH) return;
        const next = Math.max(10, Math.min(260, Math.floor(fs * Math.min(W / needW, H / needH) * 2) / 2));
        if (Math.abs(next - fs) < 0.5) break;
        fs = next;
        ov.style.setProperty("--fs", `${fs}px`);
      }
    }
    window.addEventListener("resize", fitText);

    // 未鎖定時：拖曳移動、右下角縮放
    ov.addEventListener("mousedown", (e) => {
      if (locked || e.button !== 0) return;
      if (e.target === grip) win.startResizeDragging("SouthEast");
      else win.startDragging();
    });
    document.addEventListener("contextmenu", (e) => e.preventDefault());
  </script>
</body>
</html>
