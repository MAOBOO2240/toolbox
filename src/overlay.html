<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>浮動計時器</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      font-family: "Segoe UI Variable Display", "Segoe UI", "Microsoft JhengHei UI", sans-serif;
    }
    .ov {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      container-type: size;
      border-radius: 14px;
      transition: background 0.2s, box-shadow 0.2s;
    }
    /* 未鎖定：顯示底色與邊框，可拖曳、可縮放 */
    .ov.unlocked {
      background: rgba(0, 0, 0, 0.38);
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.55);
      cursor: move;
    }
    .name {
      max-width: 96%;
      font-size: min(24cqh, 11cqw);
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9), 0 0 6px rgba(0, 0, 0, 0.6);
      line-height: 1.15;
    }
    .time {
      --heat: 0;
      font-size: min(56cqh, 26cqw);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      line-height: 1.05;
      /* 倒數中：粗體白色填滿＋陰影，越接近結束越紅 */
      color: color-mix(in srgb, #ff3b30 calc(var(--heat) * 100%), #ffffff);
      text-shadow: 0 2px 3px rgba(0, 0, 0, 0.9), 0 0 8px rgba(0, 0, 0, 0.55);
    }
    /* 超時：紅色外框、不填滿 */
    .time.over {
      color: transparent;
      -webkit-text-stroke: max(2px, 0.045em) #ff3b30;
      text-shadow: none;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.8));
    }
    .time.idle, .time.done { color: rgba(255, 255, 255, 0.75); }
    .grip {
      display: none;
      position: absolute;
      right: 2px;
      bottom: 2px;
      width: 16px;
      height: 16px;
      cursor: se-resize;
      background:
        linear-gradient(135deg, transparent 50%, rgba(255, 255, 255, 0.85) 50%, rgba(255, 255, 255, 0.85) 60%, transparent 60%, transparent 72%, rgba(255, 255, 255, 0.85) 72%, rgba(255, 255, 255, 0.85) 82%, transparent 82%);
    }
    .ov.unlocked .grip { display: block; }
  </style>
</head>
<body>
  <div class="ov" id="ov">
    <div class="name" id="name"></div>
    <div class="time idle" id="time">--:--</div>
    <div class="grip" id="grip"></div>
  </div>
  <script>
    "use strict";
    const T = window.__TAURI__;
    const win = T.window.getCurrentWindow();
    const id = win.label.replace(/^ov-/, "");
    const ov = document.getElementById("ov");
    const nameEl = document.getElementById("name");
    const timeEl = document.getElementById("time");

    const pad = (n) => String(n).padStart(2, "0");
    function fmt(sec) {
      sec = Math.max(0, sec);
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
      return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
    }

    let locked = true;
    T.event.listen("timer-tick", (e) => {
      const s = e.payload.timers.find((t) => t.id === id);
      if (!s) return;
      if (nameEl.textContent !== s.name) nameEl.textContent = s.name;
      ov.style.opacity = s.opacity;
      locked = s.locked;
      ov.classList.toggle("unlocked", !locked);

      let text;
      if (s.phase === "over") text = "+" + fmt(Math.floor(s.over_ms / 1000));
      else if (s.phase === "running") text = fmt(Math.ceil(s.remain_ms / 1000));
      else if (s.phase === "done") text = "00:00";
      else text = fmt(Math.round(s.total_ms / 1000));
      if (timeEl.textContent !== text) timeEl.textContent = text;
      timeEl.className = "time " + s.phase;

      let heat = 0;
      if (s.phase === "running" && s.total_ms) {
        const frac = s.remain_ms / s.total_ms;
        heat = frac >= 0.3 ? 0 : Math.min(1, 1 - frac / 0.3);
      }
      timeEl.style.setProperty("--heat", heat.toFixed(3));
    });

    // 未鎖定時：拖曳移動、右下角縮放
    ov.addEventListener("mousedown", (e) => {
      if (locked || e.button !== 0) return;
      if (e.target.id === "grip") win.startResizeDragging("SouthEast");
      else win.startDragging();
    });
    document.addEventListener("contextmenu", (e) => e.preventDefault());
  </script>
</body>
</html>
