<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>新分頁</title>
  <style>
    /* 瀏覽器自己的頁面：新分頁、歷史記錄、下載、書籤、擴充功能、設定（網址列顯示成 chrome://…） */
    * { box-sizing: border-box; margin: 0; }
    :root { --bg: #1f1f1f; --card: #2a2a2a; --card2: #333; --line: #444746; --text: #e3e3e3; --text2: #c7c7c7; --dim: #9aa0a6; --accent: #a8c7fa; --on-accent: #062e6f; --hover: rgba(227, 227, 227, 0.08); --danger: #f2b8b5; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font: 13px/1.5 "Segoe UI", "Microsoft JhengHei UI", "Microsoft JhengHei", system-ui, sans-serif; }
    body { overflow-y: auto; }
    body::-webkit-scrollbar { width: 12px; }
    body::-webkit-scrollbar-thumb { background: #5e5e5e; border-radius: 6px; border: 3px solid var(--bg); }
    svg.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; display: block; }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
    input, select { font: inherit; color: var(--text); }
    a { color: var(--accent); text-decoration: none; cursor: pointer; }
    a:hover { text-decoration: underline; }
    [hidden] { display: none !important; }
    .fav { width: 16px; height: 16px; border-radius: 3px; object-fit: contain; display: block; }
    .letter { width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; }
    .gl { display: grid; place-items: center; }

    /* 上面那一條：標題與搜尋框 */
    header { position: sticky; top: 0; z-index: 5; height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 24px; background: var(--bg); }
    header .brand { flex: none; width: 232px; display: flex; align-items: center; gap: 12px; font-size: 22px; }
    header .brand .gl { color: var(--accent); }
    header .brand svg { width: 26px; height: 26px; }
    header h1 { font-size: 22px; font-weight: 400; white-space: nowrap; }
    .search { flex: 0 1 680px; height: 44px; border-radius: 22px; background: var(--card); display: flex; align-items: center; gap: 12px; padding: 0 16px; color: var(--text2); }
    .search:focus-within { background: #333; box-shadow: 0 0 0 2px var(--accent); }
    .search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; font-size: 15px; }
    .search input::placeholder { color: var(--dim); }
    header .right { flex: 1; display: flex; justify-content: flex-end; gap: 8px; }
    main { padding: 8px 24px 48px; display: flex; gap: 24px; }
    nav { flex: none; width: 232px; position: sticky; top: 72px; align-self: flex-start; display: flex; flex-direction: column; gap: 2px; }
    nav button { height: 40px; border-radius: 0 20px 20px 0; margin-left: -24px; padding: 0 16px 0 24px; display: flex; align-items: center; gap: 14px; text-align: left; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    nav button:hover { background: var(--hover); }
    nav button.on { background: #004a77; color: #c2e7ff; }
    nav button .gl svg { width: 20px; height: 20px; }
    nav .sub { padding-left: 20px; }
    .col { flex: 1; min-width: 0; max-width: 960px; }
    .card { background: var(--card); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
    h2 { font-size: 14px; font-weight: 500; color: var(--text2); padding: 16px 4px 8px; }
    .card h3 { font-size: 14px; font-weight: 500; padding: 14px 20px 10px; color: var(--text); }
    .btn { height: 36px; padding: 0 18px; border-radius: 18px; border: 1px solid #5e5e5e; color: var(--accent); white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
    .btn:hover { background: rgba(168, 199, 250, 0.1); }
    .btn.fill { border-color: var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 500; }
    .btn.fill:hover { background: #bdd6fb; }
    .btn.red { color: var(--danger); }
    .btn:disabled { opacity: 0.45; pointer-events: none; }
    .btn svg { width: 18px; height: 18px; }
    .ib { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--text2); }
    .ib:hover { background: rgba(227, 227, 227, 0.12); }
    .ib svg { width: 18px; height: 18px; }
    .muted { color: var(--dim); }
    .emptybox { padding: 56px 24px; text-align: center; color: var(--dim); font-size: 14px; }
    /* 清單的一列 */
    .rw { min-height: 44px; display: flex; align-items: center; gap: 14px; padding: 0 12px 0 20px; }
    .rw + .rw { border-top: 1px solid rgba(255, 255, 255, 0.05); }
    .rw:hover { background: var(--hover); }
    .rw .tm { flex: none; width: 76px; color: var(--dim); font-size: 12px; }
    .rw .ti { flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); cursor: pointer; }
    .rw .ti:hover { text-decoration: underline; }
    .rw .ho { flex: 1 1 0; min-width: 60px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); font-size: 12px; }
    .rw .acts { flex: none; display: flex; visibility: hidden; }
    .rw:hover .acts { visibility: visible; }
    input[type="checkbox"] { appearance: none; flex: none; width: 16px; height: 16px; border: 2px solid #8e918f; border-radius: 3px; background: none; cursor: pointer; display: grid; place-items: center; }
    input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
    input[type="checkbox"]:checked::after { content: ""; width: 8px; height: 4px; border-left: 2px solid var(--on-accent); border-bottom: 2px solid var(--on-accent); transform: rotate(-45deg) translate(1px, -1px); }
    /* 開關 */
    input.sw[type="checkbox"] { appearance: none; flex: none; display: block; width: 36px; height: 20px; border: 0; border-radius: 10px; background: #5e5e5e; position: relative; cursor: pointer; transition: background 0.15s; }
    input.sw[type="checkbox"]::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border: 0; border-radius: 50%; background: #c7c7c7; transform: none; transition: transform 0.15s, background 0.15s; }
    input.sw[type="checkbox"]:checked { background: var(--accent); }
    input.sw[type="checkbox"]:checked::after { transform: translateX(16px); background: var(--on-accent); }
    .opt { min-height: 56px; display: flex; align-items: center; gap: 16px; padding: 8px 20px; }
    .opt + .opt { border-top: 1px solid rgba(255, 255, 255, 0.06); }
    .opt .tx { flex: 1; min-width: 0; }
    .opt .tx small { display: block; color: var(--dim); font-size: 12px; }
    select, .tin { height: 36px; border-radius: 8px; border: 1px solid #5e5e5e; background: var(--bg); padding: 0 10px; outline: 0; }
    select:focus, .tin:focus { border-color: var(--accent); }
    .tin { min-width: 0; }
    .bar { position: sticky; top: 64px; z-index: 4; height: 52px; margin-bottom: 12px; border-radius: 12px; background: #004a77; color: #c2e7ff; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 20px; }
    .bar span { flex: 1; }
    .bar .btn { border-color: #c2e7ff; color: #c2e7ff; }

    /* 新分頁 */
    .ntp { min-height: 100%; display: flex; flex-direction: column; align-items: center; padding: 16vh 24px 40px; }
    .ntp .brandname { font-size: 44px; font-weight: 300; letter-spacing: 2px; color: var(--text2); margin-bottom: 28px; }
    .ntp .box { width: min(680px, 100%); height: 52px; border-radius: 26px; background: var(--card2); display: flex; align-items: center; gap: 14px; padding: 0 20px; color: var(--text2); }
    .ntp .box:focus-within { background: #3c3c3c; box-shadow: 0 1px 6px rgba(0, 0, 0, 0.5); }
    .ntp .box input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; font-size: 16px; }
    .ntp .box input::placeholder { color: var(--dim); }
    .tiles { margin-top: 32px; width: min(600px, 100%); display: grid; grid-template-columns: repeat(auto-fill, 112px); justify-content: center; gap: 4px 8px; }
    .tile { width: 112px; height: 112px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 0 8px; color: var(--text); }
    .tile:hover { background: var(--hover); text-decoration: none; }
    .tile .circ { width: 48px; height: 48px; border-radius: 50%; background: var(--card2); display: grid; place-items: center; }
    .tile .circ img { width: 24px; height: 24px; }
    .tile .circ .letter { width: 24px; height: 24px; font-size: 13px; border-radius: 6px; }
    .tile .circ .gl svg { width: 22px; height: 22px; color: var(--text2); }
    .tile span.nm { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
    .inc { max-width: 620px; margin-top: 8px; }
    .inc h1 { font-size: 24px; font-weight: 400; margin: 20px 0 12px; }
    .inc .gl svg { width: 72px; height: 72px; stroke-width: 1.2; color: var(--text2); }
    .inc p, .inc li { color: var(--text2); font-size: 14px; line-height: 1.7; }
    .inc ul { margin: 8px 0 0 20px; }

    /* 下載 */
    .dl { display: flex; gap: 16px; padding: 16px 12px 16px 20px; }
    .dl .fi { flex: none; width: 40px; height: 40px; border-radius: 8px; background: var(--card2); display: grid; place-items: center; color: var(--text2); }
    .dl .bd { flex: 1; min-width: 0; }
    .dl .nm { font-size: 14px; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; display: block; }
    .dl.gone .nm, .dl.bad .nm { color: var(--dim); text-decoration: line-through; cursor: default; }
    .dl.run .nm { color: var(--text); cursor: default; }
    .dl .ur { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    .dl .stt { margin-top: 6px; color: var(--text2); font-size: 12px; }
    .dl .pg { height: 4px; border-radius: 2px; background: #444746; margin-top: 8px; overflow: hidden; }
    .dl .pg i { display: block; height: 100%; background: var(--accent); }
    .dl .pg.busy i { width: 30%; animation: slide 1.2s linear infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
    .dl .ln { margin-top: 8px; display: flex; gap: 16px; }

    /* 書籤管理員 */
    .tree button { height: 36px; }
    .bmrow .ic-wrap { flex: none; width: 20px; display: grid; place-items: center; color: var(--text2); }
    .bmrow .ic-wrap svg { width: 18px; height: 18px; }
    .crumb { display: flex; align-items: center; gap: 6px; padding: 4px 4px 12px; color: var(--text2); font-size: 14px; flex-wrap: wrap; }
    .crumb b { font-weight: 500; color: var(--text); }

    /* 擴充功能 */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
    .ext { background: var(--card); border-radius: 12px; padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 10px; min-height: 150px; }
    .ext .hd { display: flex; gap: 14px; }
    .ext .hd img, .ext .hd .letter, .ext .hd .gl { flex: none; width: 40px; height: 40px; }
    .ext .hd .letter { font-size: 18px; border-radius: 8px; }
    .ext .hd .gl svg { width: 30px; height: 30px; color: var(--text2); }
    .ext .nm { font-size: 14px; font-weight: 500; }
    .ext .ds { color: var(--dim); font-size: 12px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-all; }
    .ext .ft { margin-top: auto; display: flex; align-items: center; gap: 8px; }
    .ext .ft .sp { flex: 1; }
    .ext.off .hd { opacity: 0.55; }
    .note { color: var(--dim); font-size: 12px; padding: 0 4px 12px; line-height: 1.7; }

    /* 對話框 */
    .veil { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.55); display: grid; place-items: center; padding: 24px; }
    .dlg { width: min(520px, 100%); max-height: 100%; overflow-y: auto; background: #2a2a2a; border-radius: 16px; padding: 20px 24px 16px; box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6); }
    .dlg h1 { font-size: 18px; font-weight: 400; margin-bottom: 16px; }
    .dlg label.f { display: block; margin-bottom: 14px; color: var(--text2); font-size: 12px; }
    .dlg label.f .tin, .dlg label.f select { display: block; width: 100%; margin-top: 6px; font-size: 13px; }
    .dlg .ck { display: flex; gap: 14px; padding: 10px 0; align-items: flex-start; }
    .dlg .ck input { margin-top: 3px; }
    .dlg .ck small { display: block; color: var(--dim); font-size: 12px; }
    .dlg .ft { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .dlg .err { color: var(--danger); font-size: 12px; min-height: 18px; }
    #toast { position: fixed; left: 24px; bottom: 24px; z-index: 30; background: #e3e3e3; color: #1f1f1f; padding: 12px 18px; border-radius: 8px; font-size: 13px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5); }
    @media (max-width: 860px) { nav { display: none; } header .brand { width: auto; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="veil" class="veil" hidden></div>
  <div id="toast" hidden></div>
  <script src="web-icons.js"></script>
  <script>
    "use strict";
    (() => {
      // 這個頁面只能直接開在瀏覽器的分頁裡：被別的網頁內嵌就不顯示；也不接受別的視窗傳來的訊息
      if (window.top !== window) { document.documentElement.textContent = ""; return; }
      const T = window.__TAURI__;
      if (!T) return;
      const { ICONS, icon, host } = window.MB;
      const call = (cmd, args) => T.core.invoke(cmd, args);
      const quiet = (cmd, args) => call(cmd, args).catch(() => null);
      const P = new URLSearchParams(location.search);
      const PAGES = { newtab: "新分頁", history: "歷史記錄", downloads: "下載", bookmarks: "書籤", extensions: "擴充功能", settings: "設定" };
      const PAGE_ICON = { history: "history", downloads: "download", bookmarks: "star", extensions: "puzzle", settings: "gear" };
      const page = PAGES[P.get("p")] ? P.get("p") : "newtab";
      const app = document.getElementById("app");
      document.title = PAGES[page];

      const el = (tag, cls, text) => {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
      };
      const glyph = (name, cls) => { const s = el("span", "gl" + (cls ? ` ${cls}` : "")); s.innerHTML = ICONS[name] || ""; return s; };
      const btn = (text, cls, ic) => { const b = el("button", `btn ${cls || ""}`); if (ic) b.innerHTML = ICONS[ic]; b.append(text); return b; };
      const ib = (ic, title) => { const b = el("button", "ib"); b.innerHTML = ICONS[ic]; b.title = title; return b; };
      // 開網址：左鍵在這個分頁、中鍵或 Ctrl 開新分頁
      const open = (url, newTab) => quiet("web_ui_open", { url, newTab: !!newTab });
      const cmd = (name) => quiet("web_cmd", { cmd: name, tab: null });
      function linkify(node, url) {
        node.addEventListener("click", (e) => open(url, e.ctrlKey));
        node.addEventListener("auxclick", (e) => { if (e.button === 1) open(url, true); });
        node.addEventListener("mousedown", (e) => { if (e.button === 1) e.preventDefault(); });
      }
      let toastTimer = 0;
      function toast(text) {
        const t = document.getElementById("toast");
        t.textContent = text;
        t.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (t.hidden = true), 2600);
      }
      const fail = (e) => toast(typeof e === "string" ? e : "沒有成功，請再試一次");

      /* ---------- 對話框 ---------- */
      const veil = document.getElementById("veil");
      function dialog(title, build) {
        veil.innerHTML = "";
        const d = el("div", "dlg");
        d.append(el("h1", "", title));
        const close = () => { veil.hidden = true; veil.innerHTML = ""; };
        build(d, close);
        veil.append(d);
        veil.hidden = false;
        veil.onmousedown = (e) => { if (e.target === veil) close(); };
        const first = d.querySelector("input.tin, select");
        if (first) setTimeout(() => { first.focus(); if (first.select) first.select(); }, 0);
        return close;
      }
      document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !veil.hidden) { veil.hidden = true; veil.innerHTML = ""; } });
      function field(d, label, value, placeholder) {
        const l = el("label", "f", label);
        const i = el("input", "tin");
        i.value = value || "";
        i.spellcheck = false;
        i.autocomplete = "off";
        if (placeholder) i.placeholder = placeholder;
        l.append(i);
        d.append(l);
        return i;
      }
      function footer(d, okText, onOk, close, danger) {
        const err = el("div", "err");
        const ft = el("div", "ft");
        const cancel = btn("取消");
        const ok = btn(okText, danger ? "fill" : "fill");
        cancel.onclick = close;
        ok.onclick = async () => {
          ok.disabled = true;
          err.textContent = "";
          try { await onOk(); close(); } catch (e) { err.textContent = typeof e === "string" ? e : "沒有成功，請再試一次"; ok.disabled = false; }
        };
        d.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.tagName === "INPUT" && !e.isComposing && e.keyCode !== 229) ok.click(); });
        ft.append(cancel, ok);
        d.append(err, ft);
        return ok;
      }

      /* ---------- 共用的頁面外框 ---------- */
      function shell(opts) {
        app.innerHTML = "";
        const header = el("header");
        const brand = el("div", "brand");
        brand.append(glyph(PAGE_ICON[page]), el("h1", "", PAGES[page]));
        header.append(brand);
        let input = null;
        if (opts.search) {
          const s = el("div", "search");
          s.innerHTML = ICONS.search;
          input = el("input");
          input.placeholder = opts.search;
          input.spellcheck = false;
          input.autocomplete = "off";
          input.value = P.get("q") || "";
          s.append(input);
          header.append(s);
        }
        const right = el("div", "right");
        header.append(right);
        const main = el("main");
        const nav = el("nav");
        const col = el("div", "col");
        main.append(nav, col);
        app.append(header, main);
        return { header, right, nav, col, input };
      }
      function navButton(nav, text, ic, on, fn) {
        const b = el("button", on ? "on" : "");
        if (ic) b.append(glyph(ic));
        b.append(el("span", "", text));
        b.onclick = fn;
        nav.append(b);
        return b;
      }
      const debounce = (fn, ms) => { let t = 0; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
      const size = (n) => {
        if (!(n > 0)) return "0 B";
        const u = ["B", "KB", "MB", "GB", "TB"];
        let i = 0;
        while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
        return `${n >= 100 || i === 0 ? Math.round(n) : n.toFixed(1)} ${u[i]}`;
      };
      const dayKey = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; };
      function dayLabel(ms) {
        const d = new Date(ms);
        const full = d.toLocaleDateString("zh-TW", { year: "numeric", month: "long", day: "numeric", weekday: "long" });
        const today = new Date();
        const y = new Date(today.getFullYear(), today.getMonth(), today.getDate() - 1);
        if (dayKey(ms) === dayKey(today.getTime())) return `今天 - ${full}`;
        if (dayKey(ms) === dayKey(y.getTime())) return `昨天 - ${full}`;
        return full;
      }
      const timeLabel = (ms) => new Date(ms).toLocaleTimeString("zh-TW", { hour: "numeric", minute: "2-digit" });

      /* ---------- 新分頁 ---------- */
      async function newtab() {
        const info = (await quiet("web_ui_newtab")) || { engine: "Google", incognito: false, shortcuts: [] };
        app.innerHTML = "";
        const wrap = el("div", "ntp");
        if (info.incognito) {
          const box = el("div", "inc");
          box.append(glyph("incognito"));
          box.append(el("h1", "", "你已進入無痕模式"));
          box.append(el("p", "", "這個視窗裡的瀏覽記錄、Cookie 和網站資料不會留下來，關掉視窗就會清掉；也不會用到一般視窗的登入狀態。下載的檔案和加入的書籤會保留。"));
          box.append(el("p", "", "你造訪的網站、公司或學校的網路、網路服務供應商仍然看得到你的活動。"));
          wrap.style.alignItems = "center";
          wrap.append(box);
          app.append(wrap);
          return;
        }
        wrap.append(el("div", "brandname", "MAOBOO"));
        const box = el("div", "box");
        box.innerHTML = ICONS.search;
        const input = el("input");
        input.placeholder = `在 ${info.engine} 搜尋或輸入網址`;
        input.spellcheck = false;
        input.autocomplete = "off";
        input.addEventListener("keydown", (e) => {
          if (e.key !== "Enter" || e.isComposing || e.keyCode === 229 || !input.value.trim()) return;
          quiet("web_go", { input: input.value, newTab: e.altKey });
        });
        box.append(input);
        wrap.append(box);
        const tiles = el("div", "tiles");
        for (const s of info.shortcuts || []) {
          const a = el("a", "tile");
          a.title = `${s.title}\n${s.url}`;
          const c = el("span", "circ");
          c.append(icon(s.icon || "", s.title || host(s.url)));
          a.append(c, el("span", "nm", s.title || host(s.url)));
          linkify(a, s.url);
          tiles.append(a);
        }
        wrap.append(tiles);
        app.append(wrap);
      }

      /* ---------- 歷史記錄 ---------- */
      function history() {
        const ui = shell({ search: "搜尋歷史記錄" });
        navButton(ui.nav, "歷史記錄", "history", true, () => {});
        navButton(ui.nav, "刪除瀏覽資料", "trash", false, () => open("chrome://settings/clearBrowserData"));
        const PAGE_N = 150;
        let rows = [], done = false, busy = false, q = ui.input.value.trim();
        const picked = new Set();
        const key = (r) => `${r.at}\n${r.u}`;
        const bar = el("div", "bar");
        bar.hidden = true;
        const barText = el("span");
        const cancel = btn("取消"), del = btn("刪除");
        bar.append(barText, cancel, del);
        const list = el("div");
        ui.col.append(bar, list);
        function syncBar() {
          bar.hidden = picked.size === 0;
          barText.textContent = `已選取 ${picked.size} 個項目`;
        }
        cancel.onclick = () => { picked.clear(); syncBar(); render(); };
        del.onclick = async () => {
          const items = rows.filter((r) => picked.has(key(r))).map((r) => [r.u, r.at]);
          await quiet("web_ui_history_delete", { items });
          picked.clear();
          syncBar();
          load(true);
        };
        function render() {
          list.innerHTML = "";
          if (!rows.length) {
            list.append(el("div", "emptybox", q ? `找不到「${q}」的搜尋結果` : "這裡會顯示你的瀏覽記錄"));
            return;
          }
          let card = null, last = "";
          for (const r of rows) {
            const k = dayKey(r.at);
            if (k !== last) {
              last = k;
              list.append(el("h2", "", dayLabel(r.at)));
              card = el("div", "card");
              list.append(card);
            }
            const row = el("div", "rw");
            const ck = el("input");
            ck.type = "checkbox";
            ck.checked = picked.has(key(r));
            ck.onchange = () => { ck.checked ? picked.add(key(r)) : picked.delete(key(r)); syncBar(); };
            const ti = el("span", "ti", r.t || r.u);
            ti.title = `${r.t}\n${r.u}`;
            linkify(ti, r.u);
            const x = ib("close", "從歷史記錄中移除");
            x.onclick = async () => { await quiet("web_ui_history_delete", { items: [[r.u, r.at]] }); rows = rows.filter((y) => y !== r); picked.delete(key(r)); syncBar(); render(); };
            const acts = el("span", "acts");
            acts.append(x);
            row.append(ck, el("span", "tm", timeLabel(r.at)), icon(r.icon || "globe", r.t || r.host), ti, el("span", "ho", r.host), acts);
            card.append(row);
          }
        }
        async function load(reset) {
          if (busy) return;
          busy = true;
          const before = reset || !rows.length ? null : rows[rows.length - 1].at;
          const got = (await quiet("web_ui_history", { q, before, limit: PAGE_N })) || [];
          rows = reset ? got : rows.concat(got);
          done = got.length < PAGE_N;
          busy = false;
          render();
        }
        ui.input.addEventListener("input", debounce(() => { q = ui.input.value.trim(); picked.clear(); syncBar(); load(true); }, 200));
        // 捲到底接著載入
        window.addEventListener("scroll", () => {
          if (!done && !busy && window.innerHeight + window.scrollY >= document.body.scrollHeight - 400) load(false);
        });
        load(true);
      }

      /* ---------- 下載 ---------- */
      function downloads() {
        const ui = shell({ search: "搜尋下載記錄" });
        const clear = btn("全部清除");
        ui.right.append(clear);
        ui.nav.remove();
        const list = el("div");
        ui.col.style.margin = "0 auto";
        ui.col.style.maxWidth = "720px";
        ui.col.append(list);
        let q = ui.input.value.trim(), sig = "";
        const act = async (id, a) => { try { await call("web_ui_download", { id, act: a }); } catch (e) { fail(e); } load(); };
        clear.onclick = () => act(0, "clear");
        const STATE = { canceled: "已取消", failed: "失敗" };
        function render(rows) {
          list.innerHTML = "";
          if (!rows.length) {
            list.append(el("div", "emptybox", q ? `找不到「${q}」的搜尋結果` : "下載的檔案會顯示在這裡"));
            return;
          }
          let last = "";
          for (const d of rows) {
            const k = dayKey(d.at);
            if (k !== last) { last = k; list.append(el("h2", "", dayLabel(d.at))); }
            const run = d.state === "progress";
            const bad = d.state === "canceled" || d.state === "failed";
            const card = el("div", "card dl" + (run ? " run" : "") + (bad ? " bad" : "") + (d.gone ? " gone" : ""));
            const fi = el("div", "fi");
            fi.innerHTML = ICONS.file;
            const bd = el("div", "bd");
            const nm = el("span", "nm", d.name || d.url);
            nm.title = d.path;
            if (d.state === "done" && !d.gone) nm.onclick = () => act(d.id, "open");
            const ur = el("a", "ur", d.url);
            ur.title = d.url;
            if (/^https?:/.test(d.url)) linkify(ur, d.url);
            bd.append(nm, ur);
            if (run) {
              const known = d.total > 0;
              bd.append(el("div", "stt", known ? `${size(d.received)} / ${size(d.total)}` : `${size(d.received)}`));
              const pg = el("div", "pg" + (known ? "" : " busy"));
              const bar = el("i");
              if (known) bar.style.width = `${Math.min(100, (d.received / d.total) * 100)}%`;
              pg.append(bar);
              bd.append(pg);
              const ln = el("div", "ln");
              const c = el("a", "", "取消");
              c.onclick = () => act(d.id, "cancel");
              ln.append(c);
              bd.append(ln);
            } else if (bad) {
              bd.append(el("div", "stt", STATE[d.state]));
              const ln = el("div", "ln");
              const r = el("a", "", "重試");
              r.onclick = () => act(d.id, "retry");
              ln.append(r);
              bd.append(ln);
            } else if (d.gone) {
              bd.append(el("div", "stt", "已刪除"));
            } else {
              const ln = el("div", "ln");
              const s = el("a", "", "在資料夾中顯示");
              s.onclick = () => act(d.id, "show");
              ln.append(s);
              bd.append(ln);
            }
            card.append(fi, bd);
            if (!run) {
              const x = ib("close", "從清單中移除");
              x.onclick = () => act(d.id, "remove");
              card.append(x);
            }
            list.append(card);
          }
        }
        async function load() {
          const rows = (await quiet("web_ui_downloads", { q })) || [];
          const s = JSON.stringify(rows);
          if (s !== sig) { sig = s; render(rows); }
        }
        ui.input.addEventListener("input", debounce(() => { q = ui.input.value.trim(); load(); }, 200));
        load();
        // 下載中的進度每秒更新（畫面沒顯示時不更新）
        setInterval(() => { if (!document.hidden) load(); }, 1000);
      }

      /* ---------- 書籤管理員 ---------- */
      function bookmarks() {
        const ui = shell({ search: "搜尋書籤" });
        const addB = btn("新增書籤", "", "plus"), addF = btn("新增資料夾", "", "new-folder");
        ui.right.append(addB, addF);
        ui.nav.classList.add("tree");
        let data = { bar: [], other: [], icons: {} };
        let cur = "bar", q = ui.input.value.trim();
        const ROOTS = { bar: "書籤列", other: "所有書籤" };
        const find = (list, id, trail) => {
          for (const b of list) {
            if (b.id === id) return [...trail, b];
            if (!b.url) { const x = find(b.children || [], id, [...trail, b]); if (x) return x; }
          }
          return null;
        };
        // 目前資料夾的路徑：[根, 資料夾, 資料夾…]
        function path() {
          if (ROOTS[cur]) return [{ id: cur, title: ROOTS[cur], children: data[cur] }];
          for (const root of ["bar", "other"]) {
            const t = find(data[root], cur, []);
            if (t) return [{ id: root, title: ROOTS[root], children: data[root] }, ...t];
          }
          cur = "bar";
          return [{ id: "bar", title: ROOTS.bar, children: data.bar }];
        }
        const folders = () => {
          const out = [];
          const walk = (list, depth) => { for (const b of list) if (!b.url) { out.push([b.id, `${"　".repeat(depth)}${b.title || "（未命名）"}`]); walk(b.children || [], depth + 1); } };
          out.push(["bar", ROOTS.bar]);
          walk(data.bar, 1);
          out.push(["other", ROOTS.other]);
          walk(data.other, 1);
          return out;
        };
        const iconOf = (b) => (b.url ? data.icons[host(b.url)] || "globe" : "folder");
        function editDialog(b, parentId) {
          dialog(b.url ? "編輯書籤" : "重新命名資料夾", (d, close) => {
            const name = field(d, "名稱", b.title);
            const url = b.url ? field(d, "網址", b.url) : null;
            const l = el("label", "f", "資料夾");
            const sel = el("select");
            for (const [id, title] of folders()) {
              if (id === b.id) continue;
              const o = el("option", "", title);
              o.value = id;
              o.selected = id === parentId;
              sel.append(o);
            }
            l.append(sel);
            d.append(l);
            footer(d, "儲存", async () => {
              await call("web_bm_edit", { id: b.id, title: name.value, url: url ? url.value : null });
              if (sel.value !== parentId) await call("web_bm_place", { id: b.id, parent: sel.value, index: null });
              load();
            }, close);
          });
        }
        function addDialog(folder) {
          dialog(folder ? "新增資料夾" : "新增書籤", (d, close) => {
            const name = field(d, "名稱", folder ? "新資料夾" : "");
            const url = folder ? null : field(d, "網址", "", "https://");
            footer(d, "儲存", async () => {
              if (folder) await call("web_bm_add_folder", { parent: cur, title: name.value });
              else await call("web_bm_add", { parent: cur, title: name.value, url: url.value });
              load();
            }, close);
          });
        }
        addB.onclick = () => addDialog(false);
        addF.onclick = () => addDialog(true);
        function rowOf(b, parentId, where) {
          const row = el("div", "rw bmrow");
          const ti = el("span", "ti", b.title || b.url || "（未命名）");
          ti.title = b.url ? `${b.title}\n${b.url}` : b.title;
          if (b.url) linkify(ti, b.url);
          else ti.onclick = () => { cur = b.id; q = ""; ui.input.value = ""; render(); };
          const edit = ib("edit", b.url ? "編輯" : "重新命名"), del = ib("trash", "刪除");
          edit.onclick = () => editDialog(b, parentId);
          del.onclick = async () => { await quiet("web_bm_delete", { id: b.id }); load(); };
          const acts = el("span", "acts");
          acts.append(edit, del);
          const lead = el("span", "ic-wrap");
          lead.append(icon(iconOf(b), b.title || host(b.url)));
          row.append(lead, ti, el("span", "ho", b.url ? (where ? `${where}・${b.url}` : b.url) : `${(b.children || []).length} 個項目`), acts);
          return row;
        }
        function render() {
          // 左邊：資料夾
          ui.nav.innerHTML = "";
          const tree = (list, depth) => {
            for (const b of list) {
              if (b.url) continue;
              const nb = navButton(ui.nav, b.title || "（未命名）", "folder", cur === b.id && !q, () => { cur = b.id; q = ""; ui.input.value = ""; render(); });
              nb.style.paddingLeft = `${24 + depth * 18}px`;
              tree(b.children || [], depth + 1);
            }
          };
          for (const root of ["bar", "other"]) {
            navButton(ui.nav, ROOTS[root], "folder", cur === root && !q, () => { cur = root; q = ""; ui.input.value = ""; render(); });
            tree(data[root], 1);
          }
          // 右邊：這個資料夾裡的東西（或搜尋結果）
          ui.col.innerHTML = "";
          const card = el("div", "card");
          if (q) {
            const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
            const hits = [];
            const walk = (list, parent, where) => {
              for (const b of list) {
                const hay = `${b.title}\n${b.url}`.toLowerCase();
                if (terms.every((t) => hay.includes(t))) hits.push([b, parent, where]);
                if (!b.url) walk(b.children || [], b.id, b.title);
              }
            };
            walk(data.bar, "bar", ROOTS.bar);
            walk(data.other, "other", ROOTS.other);
            ui.col.append(el("h2", "", `搜尋結果：${hits.length} 個`));
            if (!hits.length) card.append(el("div", "emptybox", `找不到「${q}」的搜尋結果`));
            for (const [b, parent, where] of hits) card.append(rowOf(b, parent, where));
            ui.col.append(card);
            return;
          }
          const trail = path();
          const crumb = el("div", "crumb");
          trail.forEach((f, i) => {
            if (i) crumb.append(glyph("chev-right"));
            if (i === trail.length - 1) crumb.append(el("b", "", f.title || "（未命名）"));
            else { const a = el("a", "", f.title || "（未命名）"); a.onclick = () => { cur = f.id; render(); }; crumb.append(a); }
          });
          ui.col.append(crumb);
          const here = trail[trail.length - 1];
          if (!(here.children || []).length) card.append(el("div", "emptybox", "這個資料夾是空的"));
          for (const b of here.children || []) card.append(rowOf(b, here.id, ""));
          ui.col.append(card);
        }
        async function load() {
          data = (await quiet("web_ui_bookmarks")) || data;
          render();
        }
        ui.input.addEventListener("input", debounce(() => { q = ui.input.value.trim(); render(); }, 150));
        load();
        // 書籤會自動跟 Chrome 同步：回到這個分頁時重新讀一次
        document.addEventListener("visibilitychange", () => { if (!document.hidden && veil.hidden) load(); });
      }

        if (!info) { ui.col.append(el("div", "emptybox", "讀不到設定")); return; }
        let q = "";
        const SECTIONS = [["sync", "你與同步來源", "user"], ["look", "外觀", "eye"], ["search", "搜尋引擎", "search"], ["fill", "自動填入和密碼", "lock"], ["dl", "下載", "download"], ["privacy", "隱私權和安全性", "trash"], ["about", "關於", "globe"]];
        const set = async (key, value) => {
          try { info.settings = (await call("web_ui_set", { key, value })) || info.settings; } catch (e) { fail(e); }
          render();
        };
        const sw = (on, key) => {
          const s = el("input", "sw");
          s.type = "checkbox";
          s.checked = on;
          s.onchange = () => set(key, s.checked);
          return s;
        };
        const opt = (title, small, control) => {
          const row = el("div", "opt");
          const tx = el("div", "tx");
          tx.append(el("div", "", title));
          if (small) tx.append(el("small", "", small));
          row.append(tx);
          if (control) row.append(control);
          row.dataset.text = `${title} ${small || ""}`.toLowerCase();
          return row;
        };
        function render() {
          const s = info.settings;
          ui.nav.innerHTML = "";
          ui.col.innerHTML = "";
          const cards = {};
          for (const [id, title, ic] of SECTIONS) {
            navButton(ui.nav, title, ic, false, () => document.getElementById(`sec-${id}`)?.scrollIntoView({ behavior: "smooth", block: "start" }));
            const h = el("h2", "", title);
            h.id = `sec-${id}`;
            h.style.scrollMarginTop = "72px";
            const c = el("div", "card");
            cards[id] = [h, c];
          }
          // 同步來源
          {
            const c = cards.sync[1];
            const ch = info.chrome || { profiles: [], error: "" };
            if (ch.error) c.append(opt("找不到 Chrome 的資料", ch.error));
            else {
              const sel = el("select");
              for (const p of ch.profiles) {
                const o = el("option", "", `${p.name}${p.account ? `（${p.account}）` : ""}・${p.count} 個書籤`);
                o.value = p.dir;
                o.selected = !!ch.current && ch.current.dir === p.dir;
                sel.append(o);
              }
              sel.onchange = async () => {
                try { await call("web_chrome_import", { dir: sel.value }); await quiet("web_ext_sync"); toast("已經改成從這個 Chrome 使用者同步"); } catch (e) { fail(e); }
                info = (await quiet("web_ui_settings")) || info;
                render();
              };
              c.append(opt("Chrome 使用者", "書籤和擴充功能從這台電腦的 Chrome 同步過來；每次開啟瀏覽器都會自動同步，Chrome 裡有變動也會跟著更新。", sel));
              const now = btn("立即同步", "", "sync");
              now.onclick = async () => {
                now.disabled = true;
                try { await call("web_chrome_import", { dir: null }); await quiet("web_ext_sync"); toast("已經跟 Chrome 同步"); } catch (e) { fail(e); }
                now.disabled = false;
              };
              c.append(opt("手動同步", "馬上跟 Chrome 同步一次書籤與擴充功能。", now));
            }
            c.append(opt("Google 帳戶同步", "這個瀏覽器不能登入 Google 帳戶來同步（那是 Chrome 才有的功能）；書籤和擴充功能是直接讀這台電腦上 Chrome 的資料。", null));
          }
          // 外觀
          {
            const c = cards.look[1];
            c.append(opt("顯示首頁按鈕", s.home_url ? s.home_url : "新分頁", sw(s.home_button, "home_button")));
            const home = el("input", "tin");
            home.style.width = "280px";
            home.placeholder = "空白 = 新分頁";
            home.value = s.home_url;
            home.spellcheck = false;
            home.onchange = () => set("home_url", home.value);
            c.append(opt("首頁的網址", "按首頁按鈕要開的網頁。", home));
            c.append(opt("顯示書籤列", "", sw(s.show_bm, "show_bm")));
            const zoom = el("select");
            for (const z of info.zooms) {
              const o = el("option", "", `${z}%`);
              o.value = String(z / 100);
              o.selected = Math.abs(z / 100 - s.default_zoom) < 0.006;
              zoom.append(o);
            }
            zoom.onchange = () => set("default_zoom", Number(zoom.value));
            c.append(opt("網頁縮放", "所有網站預設的縮放；個別網站用 Ctrl + 滾輪或 Ctrl + 加減號調整後會各自記住。", zoom));
          }
          // 搜尋引擎
          {
            const c = cards.search[1];
            const sel = el("select");
            for (const e of info.engines) {
              const o = el("option", "", e.name);
              o.value = e.id;
              o.selected = e.id === s.engine;
              sel.append(o);
            }
            sel.onchange = () => set("engine", sel.value);
            c.append(opt("網址列使用的搜尋引擎", "", sel));
            c.append(opt("改善搜尋建議", "在網址列打字時，把打的字傳給預設的搜尋引擎來取得建議（跟 Chrome 一樣）。關掉後只會用這台電腦上的歷史記錄和書籤。無痕式視窗不會傳送。", sw(s.suggest, "suggest")));
          }
          // 密碼
          {
            const c = cards.fill[1];
            c.append(opt("詢問是否儲存密碼", "登入網站時詢問要不要記住密碼，之後自動填入。密碼只存在這台電腦的瀏覽器資料裡。", sw(s.save_passwords, "save_passwords")));
          }
          // 下載
          {
            const c = cards.dl[1];
            const pick = btn("變更");
            pick.onclick = async () => {
              const d = await quiet("web_ui_pick_dir");
              if (d) set("download_dir", d);
            };
            const ctl = el("span");
            ctl.style.cssText = "display:flex;gap:8px";
            if (s.download_dir) {
              const reset = btn("恢復預設");
              reset.onclick = () => set("download_dir", "");
              ctl.append(reset);
            }
            ctl.append(pick);
            c.append(opt("位置", s.download_dir || "Windows 的「下載」資料夾", ctl));
            const openDl = btn("開啟下載頁");
            openDl.onclick = () => open("chrome://downloads/");
            c.append(opt("下載記錄", "查看下載過的檔案。", openDl));
          }
          // 隱私權
          {
            const c = cards.privacy[1];
            const clear = btn("刪除資料");
            clear.onclick = clearDialog;
            c.append(opt("刪除瀏覽資料", "刪除歷史記錄、Cookie、快取等資料。", clear));
            const hist = btn("開啟歷史記錄");
            hist.onclick = () => open("chrome://history/");
            c.append(opt("歷史記錄", "查看或刪除個別的瀏覽記錄。", hist));
          }
          // 關於
          {
            const c = cards.about[1];
            c.append(opt("MAOBOO 瀏覽器", `工具箱 ${info.app}${info.engine_version ? `・瀏覽器核心 ${info.engine_version}（Microsoft Edge WebView2，跟 Chrome 一樣是 Chromium）` : ""}`, null));
          }
          let shown = 0;
          for (const [id] of SECTIONS) {
            const [h, c] = cards[id];
            if (q) {
              let any = false;
              for (const row of [...c.children]) {
                const hit = (row.dataset.text || "").includes(q) || h.textContent.toLowerCase().includes(q);
                row.hidden = !hit;
                any = any || hit;
              }
              if (!any) continue;
            }
            shown++;
            ui.col.append(h, c);
          }
          if (!shown) ui.col.append(el("div", "emptybox", `找不到「${q}」的搜尋結果`));
        }
        ui.input.addEventListener("input", debounce(() => { q = ui.input.value.trim().toLowerCase(); render(); }, 150));
        render();
        if (P.get("s") === "clearBrowserData") clearDialog();
        const sec = SECTIONS.find(([id]) => id === P.get("s"));
        if (sec) document.getElementById(`sec-${sec[0]}`)?.scrollIntoView();
      }

      ({ newtab, history, downloads, bookmarks, extensions, settings })[page]();
    })();
  </script>
</body>
</html>
