<!doctype html>
<html lang="zh-Hant" data-font="m">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工具箱</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="timers.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- 左側分類 -->
    <aside class="sidebar">
      <div class="brand">
        <img src="assets/icon.png" alt="" class="brand-icon" />
        <span>工具箱</span>
      </div>
      <nav class="cats" id="cats">
        <button class="cat" data-cat="maple">
          <span class="cat-icon orange">
            <svg viewBox="0 0 24 24"><path d="M12 2l2.2 4.6 4.6-1.4-1.4 4.6L22 12l-4.6 2.2 1.4 4.6-4.6-1.4L12 22l-2.2-4.6-4.6 1.4 1.4-4.6L2 12l4.6-2.2-1.4-4.6 4.6 1.4z"/></svg>
          </span>
          楓之谷工具
        </button>
        <button class="cat" data-cat="tools">
          <span class="cat-icon blue">
            <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg>
          </span>
          工具箱
        </button>
      </nav>
      <div class="side-foot">
        <button class="gear" id="gearBtn" aria-label="設定">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          <span>設定</span>
        </button>
        <div class="popover" id="settingsPop">
          <p class="pop-title">設定</p>
          <div class="pop-row">
            <span>文字大小</span>
            <div class="seg" id="fontSeg">
              <button data-font="s">小</button>
              <button data-font="m">中</button>
              <button data-font="l">大</button>
            </div>
          </div>
          <div class="pop-row">
            <span>外觀</span>
            <div class="seg" id="themeSeg">
              <button data-theme="light">淺色</button>
              <button data-theme="dark">深色</button>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <!-- 右側內容 -->
    <main class="content">
      <!-- 分類頁：方形氣泡 -->
      <section class="view active" id="view-cat">
        <header class="large-title">
          <p class="eyebrow" id="catEyebrow">Toolbox</p>
          <h1 id="catTitle">工具箱</h1>
        </header>
        <div class="tiles" id="tiles"></div>
      </section>

      <!-- 序號複製 -->
      <section class="view" id="view-serial">
        <nav class="navbar">
          <button class="back" data-back><span class="back-chev">‹</span><span class="back-label"></span></button>
          <span class="nav-title">序號複製</span>
          <span></span>
        </nav>
        <div class="serial-layout">
          <div class="col-left">
            <div class="card grow">
              <label class="card-label" for="rawInput">貼上文字</label>
              <textarea id="rawInput" placeholder="貼上包含序號、時間、道具名稱等的任何文字…"></textarea>
              <div class="row">
                <button class="pill primary" id="extractBtn">擷取序號</button>
                <button class="pill ghost danger" id="clearBtn">清除</button>
              </div>
            </div>
            <div class="card status-card" id="statusCard">
              <div class="status-top">
                <div>
                  <p class="card-label">目前序號</p>
                  <p class="progress-text" id="progressText">0 / 0</p>
                </div>
                <label class="switch-wrap">
                  <span id="activeLabel">自動切換</span>
                  <span class="switch"><input type="checkbox" id="activeToggle" /><span class="slider"></span></span>
                </label>
              </div>
              <div class="bar"><div class="bar-fill" id="barFill"></div></div>
              <button class="current" id="currentSerial" title="點擊複製">—</button>
              <p class="done-banner" id="doneBanner">🎉 已全部使用完畢</p>
              <div class="row">
                <button class="pill ghost" id="prevBtn">‹ 上一組</button>
                <button class="pill ghost" id="nextBtn">下一組 ›</button>
              </div>
              <p class="hint">自動切換開啟時，在其他程式按 Ctrl+V 貼上，剪貼簿會自動換成下一組。</p>
            </div>
          </div>
          <div class="col-right card list-card">
            <div class="list-head">
              <span>序號清單</span>
              <span id="countText">0 組</span>
            </div>
            <div class="list-scroll">
              <ol class="list" id="serialList"></ol>
              <p class="empty" id="emptyText">尚未擷取任何序號</p>
            </div>
          </div>
        </div>
      </section>

      <!-- 計時器 -->
      <section class="view" id="view-timer">
        <nav class="navbar">
          <button class="back" data-back><span class="back-chev">‹</span><span class="back-label"></span></button>
          <span class="nav-title">計時器</span>
          <span></span>
        </nav>
        <div class="timer-bar">
          <label class="switch-wrap" data-tip="開啟後只在新楓之谷是目前視窗時監聽按鍵與顯示浮動視窗；切到其他視窗時繼續倒數。">
            <span class="switch sm"><input type="checkbox" id="gameOnly" /><span class="slider"></span></span>
            <span>只在新楓之谷時運作</span>
          </label>
          <span class="fg-chip" id="fgChip"><i></i><span>偵測中…</span></span>
          <span class="key-chip" id="keyChip">最後按鍵：—</span>
          <span class="spacer"></span>
          <button class="pill ghost small" id="addTimerBtn">＋ 新增計時器</button>
          <button class="pill ghost small icon-pill" id="timerSettingsBtn">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
            設定
          </button>
        </div>
        <div class="timer-scroll">
          <div class="timer-grid" id="timerGrid"></div>
        </div>
        <button class="master-btn" id="masterBtn"><i></i><span>全部關閉</span></button>

        <!-- 計時器全局設定 -->
        <div class="sheet-backdrop" id="sheetBackdrop"></div>
        <div class="sheet" id="timerSheet">
          <div class="sheet-head">
            <strong>計時器設定</strong>
            <button class="link-btn" id="sheetClose">完成</button>
          </div>
          <p class="sub">通知</p>
          <div class="field"><span class="lbl">通知方式</span>
            <div class="seg" id="prefNotify">
              <button data-v="short" data-tip="短：時間到只通知一次。">短</button>
              <button data-v="long" data-tip="長：每 3 秒重複通知，直到重新計時；計時器沒有指派按鍵時只通知一聲。">長</button>
            </div>
          </div>
          <div class="field"><span class="lbl">音效</span>
            <div class="inline">
              <select class="sel" id="prefSound">
                <option value="beep1">提示音 1（叮咚）</option>
                <option value="beep2">提示音 2（三短嗶）</option>
                <option value="beep3">提示音 3（琶音）</option>
                <option value="tts">語音唸出計時器名稱</option>
                <option value="file">自訂音效檔…</option>
              </select>
              <button class="link-btn" id="prefPreview">▶ 試聽</button>
            </div>
          </div>
          <div class="field" id="prefFileRow"><span class="lbl">音效檔</span>
            <div class="inline"><button class="pill ghost small" id="prefPick">選擇檔案</button><small class="muted" id="prefFileName"></small></div>
          </div>
          <div class="field"><span class="lbl">音量</span>
            <div class="inline"><input type="range" class="range" id="prefVolume" min="0" max="200" step="5" /><span class="muted val" id="prefVolumeVal"></span></div>
          </div>
          <p class="sub">浮動視窗</p>
          <div class="field"><span class="lbl">顯示</span>
            <label class="switch sm"><input type="checkbox" id="prefOvShow" /><span class="slider"></span></label>
          </div>
          <div class="field"><span class="lbl" data-tip="鎖定後滑鼠會穿透浮動視窗，不會擋到遊戲；解除鎖定可拖曳移動、拉右下角調整大小。">鎖定 <i class="info">i</i></span>
            <label class="switch sm"><input type="checkbox" id="prefOvLock" /><span class="slider"></span></label>
          </div>
          <div class="field"><span class="lbl">透明度</span>
            <div class="inline"><input type="range" class="range" id="prefOvOpacity" min="20" max="100" /><span class="muted val" id="prefOvOpacityVal"></span></div>
          </div>
          <div class="field"><span class="lbl"></span>
            <div class="inline"><button class="pill ghost small" id="prefOvReset">重設位置</button></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
  <script src="timers.js"></script>
</body>
</html>
