<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>工具箱通知</title>
  <style>
    /* 樣子照 Windows 11 的通知：上面是程式圖示與名稱，下面是標題、內文和「關閉」按鈕；顏色跟著 Windows 的淺色／深色 */
    :root {
      --bg: rgba(243, 243, 243, 0.985);
      --stroke: rgba(0, 0, 0, 0.09);
      --text: rgba(0, 0, 0, 0.9);
      --text-2: rgba(0, 0, 0, 0.62);
      --btn: rgba(255, 255, 255, 0.78);
      --btn-hover: rgba(249, 249, 249, 0.62);
      --btn-stroke: rgba(0, 0, 0, 0.07);
      --btn-stroke-b: rgba(0, 0, 0, 0.16);
      --hover: rgba(0, 0, 0, 0.06);
      --shadow: 0 8px 16px rgba(0, 0, 0, 0.14), 0 0 2px rgba(0, 0, 0, 0.12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: rgba(44, 44, 44, 0.985);
        --stroke: rgba(255, 255, 255, 0.09);
        --text: #ffffff;
        --text-2: rgba(255, 255, 255, 0.79);
        --btn: rgba(255, 255, 255, 0.06);
        --btn-hover: rgba(255, 255, 255, 0.09);
        --btn-stroke: rgba(255, 255, 255, 0.07);
        --btn-stroke-b: rgba(255, 255, 255, 0.05);
        --hover: rgba(255, 255, 255, 0.07);
        --shadow: 0 8px 16px rgba(0, 0, 0, 0.28), 0 0 2px rgba(0, 0, 0, 0.35);
      }
    }
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft JhengHei UI", sans-serif;
    }
    .toast {
      position: absolute;
      inset: 10px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
      color: var(--text);
      transform: translateX(calc(100% + 24px));
      opacity: 0;
      transition: transform 0.35s cubic-bezier(0, 0, 0, 1), opacity 0.2s;
    }
    .toast.show { transform: none; opacity: 1; }
    .head { flex: none; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 6px 0 16px; }
    .head img { width: 16px; height: 16px; image-rendering: auto; }
    .app { flex: 1; min-width: 0; font-size: 12px; color: var(--text-2); }
    .x {
      width: 32px; height: 28px; padding: 0; border: 0; border-radius: 4px;
      display: grid; place-items: center;
      background: transparent; color: var(--text-2);
      opacity: 0; transition: opacity 0.12s;
    }
    .toast:hover .x { opacity: 1; }
    .x:hover { background: var(--hover); color: var(--text); }
    .x svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; }
    .content { flex: 1; min-height: 0; padding: 0 16px; cursor: pointer; }
    .title { font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .body {
      font-size: 14px; line-height: 20px; color: var(--text-2);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .foot { flex: none; padding: 12px 16px 16px; }
    .btn {
      width: 100%; height: 32px; border-radius: 4px;
      border: 1px solid var(--btn-stroke); border-bottom-color: var(--btn-stroke-b);
      background: var(--btn); color: var(--text);
      font: inherit; font-size: 14px;
    }
    .btn:hover { background: var(--btn-hover); }
    .btn:active { color: var(--text-2); }
  </style>
</head>
<body>
  <div class="toast" id="toast">
    <div class="head">
      <img src="assets/icon.png" alt="" draggable="false" />
      <span class="app">工具箱</span>
      <button class="x" id="x" title="關閉"><svg viewBox="0 0 10 10"><path d="M1 1l8 8M9 1L1 9" /></svg></button>
    </div>
    <div class="content" id="content" title="開啟工具箱">
      <div class="title" id="title"></div>
      <div class="body" id="body"></div>
    </div>
    <div class="foot"><button class="btn" id="close">關閉</button></div>
  </div>
  <script>
    "use strict";
    const T = window.__TAURI__;
    const toastEl = document.getElementById("toast");
    let lastId = 0;

    // 和 Windows 的提醒通知一樣：留在畫面上，按「關閉」才收起來
    function hide() {
      toastEl.classList.remove("show");
      setTimeout(() => T.core.invoke("notify_hide").catch(() => {}), 250);
    }
    function show(n) {
      if (!n || n.id === lastId) return;
      lastId = n.id;
      document.getElementById("title").textContent = n.title;
      document.getElementById("body").textContent = n.body;
      toastEl.classList.remove("show");
      requestAnimationFrame(() => requestAnimationFrame(() => toastEl.classList.add("show")));
    }

    T.event.listen("notify", (e) => show(e.payload));
    T.core.invoke("notify_pending").then(show).catch(() => {});
    document.getElementById("x").addEventListener("click", hide);
    document.getElementById("close").addEventListener("click", hide);
    document.getElementById("content").addEventListener("click", () => { toastEl.classList.remove("show"); T.core.invoke("notify_open").catch(() => {}); });
    document.addEventListener("contextmenu", (e) => e.preventDefault());
  </script>
</body>
</html>
